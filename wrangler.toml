name = "kv-rest-api"
main = "src/index.ts"
compatibility_date = "2023-12-01"
compatibility_flags = [ "nodejs_compat" ]

[dev]
port = 8787

[vars]
KV_STORE="KV"
JWT_SECRET = "kosong-adalah-berisi-berisi-adalah-kosong"
# API_KEY is read from .dev.vars locally and from `wrangler secret` in production.
JWT_FINGERPRINT_COOKIE_NAME="__Secure-Fgp"
JWT_FINGERPRINT_REFRESH_COOKIE_NAME="__Secure-Fgp-Refresh"

ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:3001,http://127.0.0.1:5173,http://localhost:5173,https://www.ponpeskanzululumcirebon.com"

# Token expiration in minutes
REFRESH_TOKEN_EXPIRATION = 86400
TOKEN_EXPIRATION = 86400


# KV namespace for content storage
[[kv_namespaces]]
binding = "KV"
id = "04d0e33bf17247628c22f96b93bc0362"

# D1 Database for users/sessions (use --local for development)
[[d1_databases]]
binding = "DB"
database_name = "kanzululumdb"
database_id = "f2e79ed3-f652-4823-9999-e90c097c499c"